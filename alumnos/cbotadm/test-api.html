<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API - Chatbot Admin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            background: #32417f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #1e3a8a;
        }
        pre {
            background: white;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>🧪 Test API Chatbot Admin</h1>
    
    <div class="test-section">
        <h2>1. Test de Carga de Configuración</h2>
        <button onclick="testLoad()">Cargar Configuración EDDIS</button>
        <pre id="loadResult"></pre>
    </div>

    <div class="test-section">
        <h2>2. Test de Guardado</h2>
        <button onclick="testSave()">Guardar Configuración de Prueba</button>
        <pre id="saveResult"></pre>
    </div>

    <div class="test-section">
        <h2>3. Información del Navegador</h2>
        <pre id="browserInfo"></pre>
    </div>

    <script>
        // Mostrar info del navegador
        document.getElementById('browserInfo').textContent = 
            'URL Actual: ' + window.location.href + '\n' +
            'User Agent: ' + navigator.userAgent + '\n' +
            'Fetch disponible: ' + (typeof fetch !== 'undefined' ? 'SÍ' : 'NO');

        async function testLoad() {
            const result = document.getElementById('loadResult');
            result.textContent = 'Cargando...';
            
            try {
                console.log('Intentando cargar:', '../js/chatbot-config.json');
                const response = await fetch('../js/chatbot-config.json');
                console.log('Response:', response);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Datos cargados:', data);
                
                result.innerHTML = '<span class="success">✓ Carga exitosa</span>\n\n' + 
                    JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = '<span class="error">✗ Error: ' + error.message + '</span>\n\n' + 
                    error.stack;
            }
        }

        async function testSave() {
            const result = document.getElementById('saveResult');
            result.textContent = 'Guardando...';
            
            const testData = {
                entity: 'eddis',
                data: {
                    config: {
                        whatsappNumber: '5491112345678',
                        whatsappMessage: 'Test desde API',
                        title: 'Test Title',
                        subtitle: 'Test Subtitle'
                    },
                    topics: []
                }
            };
            
            try {
                console.log('Enviando a:', 'api/save.php');
                console.log('Datos:', testData);
                
                const response = await fetch('api/save.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const responseText = await response.text();
                console.log('Response text:', responseText);
                
                let responseData;
                try {
                    responseData = JSON.parse(responseText);
                } catch (e) {
                    throw new Error('Respuesta no es JSON válido: ' + responseText);
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${JSON.stringify(responseData)}`);
                }
                
                if (responseData.success) {
                    result.innerHTML = '<span class="success">✓ Guardado exitoso</span>\n\n' + 
                        JSON.stringify(responseData, null, 2);
                } else {
                    result.innerHTML = '<span class="error">✗ Error en respuesta</span>\n\n' + 
                        JSON.stringify(responseData, null, 2);
                }
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = '<span class="error">✗ Error: ' + error.message + '</span>\n\n' + 
                    error.stack;
            }
        }
    </script>
</body>
</html>
