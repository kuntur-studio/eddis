<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Resultado del Pago - SIRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/favicon_eddis.png" />
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Stolzl:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #151c3a;
      color: #fff;
      font-family: 'Stolzl', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirm-card {
      background: #020617;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.8);
      padding: 32px 24px;
      max-width: 500px;
      width: 100%;
      border: 3px solid #4a5570;
      text-align: center;
      position: relative;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 40px 20px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      color: #93c5fd;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .status-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .paid { color: #10b981; }
    .rejected { color: #ef4444; }
    .warning { color: #f59e0b; }

    .summary {
      background: #1e293b;
      border-radius: 8px;
      padding: 20px;
      margin: 24px 0;
      text-align: left;
      font-size: 0.95rem;
      border: 2px solid #334155;
    }

    .summary dt {
      color: #93c5fd;
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary dd {
      margin: 0 0 16px 0;
      color: #e5e7eb;
      font-weight: 500;
      font-size: 1rem;
    }

    .summary dd:last-child {
      margin-bottom: 0;
    }

    .btn-back {
      background: #3b82f6;
      color: #fff;
      border: 2px solid #2563eb;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-back:hover, .btn-back:focus {
      background: #2563eb;
      border-color: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: #374151;
      border-color: #4b5563;
      margin-left: 10px;
    }

    .btn-secondary:hover {
      background: #4b5563;
      border-color: #6b7280;
      box-shadow: 0 4px 12px rgba(75, 85, 99, 0.4);
    }

    .status-label {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .paid-label { color: #10b981; }
    .rejected-label { color: #ef4444; }
    .warning-label { color: #f59e0b; }

    .status-message {
      color: #cbd5e1;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .error-details {
      background: #7f1d1d;
      border: 2px solid #991b1b;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      color: #fecaca;
      font-size: 0.9rem;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    @media (max-width: 600px) {
      .confirm-card {
        padding: 24px 16px;
      }
      
      .status-icon {
        font-size: 3rem;
      }

      .status-label {
        font-size: 1.25rem;
      }

      .button-group {
        flex-direction: column;
      }

      .btn-back {
        width: 100%;
        margin-left: 0 !important;
      }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="confirm-card" id="confirmCard">
    <!-- Loader inicial -->
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="loader-text">Procesando su pago...</div>
      <div class="loader-text" style="font-size: 0.9rem; color: #64748b;">Por favor, espere un momento</div>
    </div>
  </div>

  <script>
    // Función para obtener parámetros de la URL
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        token: params.get('token'),
        idcur: params.get('idcur'),
        pais: params.get('pais') || 'ar',
        IdResultado: params.get('IdResultado'),
        IdReferenciaOperacion: params.get('IdReferenciaOperacion')
      };
    }

    // Función para formatear fecha
    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const d = new Date(dateStr);
      return d.toLocaleString('es-AR', { 
        dateStyle: 'medium', 
        timeStyle: 'short' 
      });
    }

    // Función para formatear moneda
    function formatCurrency(amount) {
      if (!amount) return '0.00';
      return parseFloat(amount).toFixed(2);
    }

    // Función para renderizar el resultado del pago
    function renderPaymentResult(data) {
      const isPaid = data.status === 'ok';
      const isError = data.status === 'error';
      
      // Detectar entorno para URLs de botones
      const isLocalhost = window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1' || 
                         window.location.hostname.includes('localhost');
      const dashUrl = isLocalhost ? '/eddis/alumnos/index.php?page=dash' : 'https://alumnos.eddis.edu.ar/dash';
      
      let icon, label, labelClass, statusText;
      
      if (isPaid) {
        icon = 'fa-circle-check paid';
        label = '¡Pago aprobado!';
        labelClass = 'paid-label';
        statusText = 'Tu pago fue procesado correctamente. ¡Gracias por tu confianza!';
      } else if (isError) {
        icon = 'fa-circle-xmark rejected';
        label = 'Pago rechazado';
        labelClass = 'rejected-label';
        statusText = data.mensaje || 'No pudimos procesar tu pago. Por favor, verifica los datos o intenta nuevamente.';
      } else {
        icon = 'fa-circle-exclamation warning';
        label = 'Pago pendiente';
        labelClass = 'warning-label';
        statusText = 'El estado de tu pago está siendo verificado.';
      }

      let summaryHTML = '';
      
      if (data.nombre && data.apellido) {
        summaryHTML += `
          <dt>Alumno</dt>
          <dd>${data.apellido}, ${data.nombre}</dd>
        `;
      }

      if (data.curso) {
        summaryHTML += `
          <dt>Curso</dt>
          <dd>${data.curso}</dd>
        `;
      }

      if (data.importe) {
        summaryHTML += `
          <dt>Monto</dt>
          <dd>$ ${formatCurrency(data.importe)}</dd>
        `;
      }

      if (data.cuota) {
        summaryHTML += `
          <dt>Cuota</dt>
          <dd>${data.cuota === 99 || data.cuota === 100 ? 'Pago único' : 'Cuota ' + data.cuota}</dd>
        `;
      }

      if (data.documento) {
        summaryHTML += `
          <dt>DNI/Documento</dt>
          <dd>${data.documento}</dd>
        `;
      }

      if (data.idpag) {
        summaryHTML += `
          <dt>Nº de Pago</dt>
          <dd>#${data.idpag}</dd>
        `;
      }

      const errorDetailsHTML = isError && data.mensaje ? `
        <div class="error-details">
          <strong>Detalles del error:</strong><br>
          ${data.mensaje}
        </div>
      ` : '';

      return `
        <div class="fade-in">
          <div class="status-icon">
            <i class="fa-solid ${icon}" aria-hidden="true"></i>
          </div>
          <div class="status-label ${labelClass}">${label}</div>
          <div class="status-message">${statusText}</div>
          ${errorDetailsHTML}
          ${summaryHTML ? `<dl class="summary" aria-label="Resumen de la operación">${summaryHTML}</dl>` : ''}
          <div class="button-group">
            <a href="${dashUrl}" class="btn-back">
              <i class="fa-solid fa-arrow-left"></i> Volver al inicio
            </a>
            ${isError ? `
              <a href="${dashUrl}#pagos" class="btn-back btn-secondary">
                <i class="fa-solid fa-rotate-right"></i> Reintentar pago
              </a>
            ` : ''}
          </div>
        </div>
      `;
    }

    // Función para mostrar error
    function showError(message) {
      // Detectar entorno para URLs de botones
      const isLocalhost = window.location.hostname === 'localhost' || 
                         window.location.hostname === '127.0.0.1' || 
                         window.location.hostname.includes('localhost');
      const dashUrl = isLocalhost ? '/eddis/alumnos/index.php?page=dash' : 'https://alumnos.eddis.edu.ar/dash';
      
      return `
        <div class="fade-in">
          <div class="status-icon">
            <i class="fa-solid fa-triangle-exclamation warning" aria-hidden="true"></i>
          </div>
          <div class="status-label warning-label">Error en el proceso</div>
          <div class="status-message">${message}</div>
          <div class="error-details">
            Por favor, verifica que la URL contenga todos los parámetros necesarios o contacta con soporte.
          </div>
          <div class="button-group">
            <a href="${dashUrl}" class="btn-back">
              <i class="fa-solid fa-arrow-left"></i> Volver al inicio
            </a>
          </div>
        </div>
      `;
    }

    // Función principal para procesar el pago
    async function procesarPago() {
      const params = getUrlParams();
      const card = document.getElementById('confirmCard');

      // Validar parámetros requeridos
      if (!params.token || !params.idcur || !params.IdResultado || !params.IdReferenciaOperacion) {
        card.innerHTML = showError('Faltan parámetros requeridos en la URL.');
        return;
      }

      try {
        // Detectar si estamos en localhost o producción
        const isLocalhost = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' || 
                           window.location.hostname.includes('localhost');
        
        // Construir URL de la API según el entorno
        let apiUrl;
        const queryParams = `token=${encodeURIComponent(params.token)}&idcur=${encodeURIComponent(params.idcur)}&pais=${encodeURIComponent(params.pais)}&IdResultado=${encodeURIComponent(params.IdResultado)}&IdReferenciaOperacion=${encodeURIComponent(params.IdReferenciaOperacion)}`;
        
        if (isLocalhost) {
          // URL para desarrollo local
          apiUrl = `/eddis/api/siro/registrar.php?${queryParams}`;
        } else {
          // URL para producción
          apiUrl = `https://servidoreddis.com.ar/api/siro/registrar.php?${queryParams}`;
        }

        console.log('Entorno:', isLocalhost ? 'localhost' : 'producción');
        console.log('API URL:', apiUrl);

        // Llamar a la API
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error(`Error HTTP: ${response.status}`);
        }

        const data = await response.json();
        
        // Renderizar resultado
        card.innerHTML = renderPaymentResult(data);

      } catch (error) {
        console.error('Error al procesar el pago:', error);
        card.innerHTML = showError('Ocurrió un error al comunicarse con el servidor. Por favor, intenta nuevamente más tarde.');
      }
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', procesarPago);
  </script>
</body>
</html>
