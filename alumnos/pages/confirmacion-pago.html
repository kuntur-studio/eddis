<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Confirmación de Pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      background: #151c3a;
      color: #fff;
      font-family: 'Stolzl', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-card {
      background: #020617;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.8);
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      border: 3px solid #4a5570;
      text-align: center;
    }
    .status-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .paid { color: #10b981; }
    .rejected { color: #ef4444; }
    .summary {
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
      margin: 24px 0;
      text-align: left;
      font-size: 1rem;
      border: 2px solid #334155;
    }
    .summary dt {
      color: #93c5fd;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .summary dd {
      margin: 0 0 12px 0;
      color: #e5e7eb;
      font-weight: 400;
    }
    .btn-back {
      background: #374151;
      color: #fff;
      border: 2px solid #4b5563;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s, border 0.2s;
    }
    .btn-back:hover, .btn-back:focus {
      background: #4b5563;
      border-color: #6b7280;
      outline: 2px solid #fbbf24;
      outline-offset: 2px;
    }
    .status-label {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    .paid-label { color: #10b981; }
    .rejected-label { color: #ef4444; }
  </style>
</head>
<body>
  <div class="confirm-card" id="confirmCard">
    <!-- El contenido se genera por JS -->
  </div>
  <script>
    // Simulación: reemplaza esto por la respuesta real de tu pasarela
    // let paymentResponse = { ... }
    // Ejemplo: window.paymentResponse = {...} (si lo inyecta la pasarela)
    const paymentResponse = window.paymentResponse || {
      "uuid": "58039ff8e68e48dfac79fa1ecb07f225",
      "paymentLinkId": "19f81d89-ca17-4bd2-8687-cc8076436042",
      "partnerCustomerKey": "IPN",
      "amount": 1414.5,
      "currency": "ARS",
      "paymentMethodType": "CARD",
      "status": "PAID",
      "operationType": "DEBIT",
      "creationDate": "2025-09-17T20:46:50.000000Z"
    };

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString('es-AR', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function renderConfirmation(data) {
      const isPaid = data.status === 'PAID';
      const icon = isPaid ? 'fa-circle-check paid' : 'fa-circle-xmark rejected';
      const label = isPaid ? '¡Pago aprobado!' : 'Pago rechazado';
      const labelClass = isPaid ? 'paid-label' : 'rejected-label';
      const statusText = isPaid
        ? 'Tu pago fue procesado correctamente. ¡Gracias por tu confianza!'
        : 'No pudimos procesar tu pago. Por favor, verifica los datos o intenta nuevamente.';
      const btnText = isPaid ? 'Volver al inicio' : 'Reintentar pago';

      return `
        <div class="status-icon"><i class="fa-solid ${icon}" aria-hidden="true"></i></div>
        <div class="status-label ${labelClass}">${label}</div>
        <div>${statusText}</div>
        <dl class="summary" aria-label="Resumen de la operación">
          <dt>Monto</dt>
          <dd>${data.amount} ${data.currency}</dd>
          <dt>Método</dt>
          <dd>${data.paymentMethodType === 'CARD' ? 'Tarjeta' : data.paymentMethodType}</dd>
          <dt>Estado</dt>
          <dd>${isPaid ? 'Aprobado' : 'Rechazado'}</dd>
          <dt>Fecha</dt>
          <dd>${formatDate(data.creationDate)}</dd>
          <dt>ID de operación</dt>
          <dd>${data.uuid}</dd>
        </dl>
        <button class="btn-back" onclick="window.location.href='inicio'">
          <i class="fa-solid fa-arrow-left"></i> ${btnText}
        </button>
      `;
    }

    document.getElementById('confirmCard').innerHTML = renderConfirmation(paymentResponse);
  </script>
</body>
</html>
